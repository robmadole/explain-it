schema: spec-driven

context: |
  Product: @explain-it/core, an npm package for building animated, step-through
  explainers of technical designs (protocols, contracts, architectures). An
  explainer is a static site: a shell with a timeline of sections, each section
  a Motion Canvas animation that advances one beat at a time with a caption.

  Origin: extracted from an ad-hoc explainer in
  FortAwesome/buildawesome-service at docs/live-contract-motion. That project is
  the first consumer and the test of the API.

  Decisions:
  - Agent-driven from the start. Agents author explainers; humans review and
    edit them. Tooling exists so agents can see and check what they drew
    (outline, snap, check).
  - No Motion Canvas editor. No editor config, no @motion-canvas/ui, no .meta
    files in consumer repos. Timing lives in code.
  - Narration lives inline, in beat(id, caption, body) calls.
  - No video export yet.
  - Scenes stay plain Motion Canvas TSX. No DSL; the library is helpers and
    components, so anything it doesn't cover is written by hand in place.

  Repo layout: a monorepo, since more packages may follow. npm workspaces.
  The root package.json is private and holds only workspace config, shared dev
  tooling and OpenSpec. Published packages live in packages/<name> and are
  named @explain-it/<name>; @explain-it/core is the first, in packages/core.
  Example explainers used as fixtures live in examples/<name>, private. Shared
  TypeScript settings live in a root tsconfig.base.json. Split a package out
  only when it has its own reason to exist; until then, one package.

  Tech stack: TypeScript, Motion Canvas 3.17 (@motion-canvas/core, /2d) as peer
  dependencies, Vite 5, Playwright for headless snap.

  Style: prefer the smallest thing that works. No speculative abstractions.
