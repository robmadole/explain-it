name: Release

# Publishes @explain-it/core to npm when a GitHub Release is published. The
# publish job waits in the `npm` environment until a required reviewer
# approves it. npm accepts it through trusted publishing (OIDC): there is no
# npm token in this repo. See RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/core version $version (expected v$version)."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e -w packages/core
      - name: Example explainer
        working-directory: examples/basic
        run: npx explainer check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Waits here for approval.
    environment: npm
    permissions:
      contents: read
      # For npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run build -w packages/core
      - run: npm publish -w packages/core
