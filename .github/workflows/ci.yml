name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e -w packages/core
      # The example is the end-to-end fixture: every command, as a user runs it.
      - name: Example explainer
        working-directory: examples/basic
        run: |
          npx explainer outline
          npx explainer snap
          npx explainer check
